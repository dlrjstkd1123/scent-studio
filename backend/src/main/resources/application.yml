# Spring Boot 자체 설정(포트, 로그 등)만 둔다.
# DB 접속정보 등 업무 설정은 egovframework/egovProps/globals.properties 에 있다.
server:
  port: ${SERVER_PORT:8090}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    # 에러 응답에 서버 내부 스택 트레이스를 싣지 않음 (devtools 기본값 덮어쓰기)
    include-stacktrace: never

spring:
  servlet:
    multipart:
      # 관리자 CSV 업로드 최대 크기
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    kr.co.seedssoft.platform: debug
    # 실행되는 SQL 을 보려면 mapper namespace 로그를 debug 로 (예: HealthDAO)
    HealthDAO: debug
