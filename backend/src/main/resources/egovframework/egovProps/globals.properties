#-----------------------------------------------------------------------
# 전역 설정 (전자정부 표준프레임워크 globals.properties)
#
# - 이 파일은 git 에 올라가므로 비밀번호 등 실제 접속정보는 넣지 않는다.
# - 로컬 개발용 실제 값은 같은 폴더의 globals-local.properties 에 적는다. (git 제외, 여기 값을 덮어씀)
# - 운영 서버에서는 환경변수로 덮어쓸 수 있다. 키의 '.' 을 '_' 로 바꾸고 대문자로 쓴다.
#     예) Globals.postgres.Password -> GLOBALS_POSTGRES_PASSWORD
#-----------------------------------------------------------------------

# DB 종류. mapper 파일 중 *_${Globals.DbType}.xml 만 읽는다.
Globals.DbType = postgres

# Supabase(PostgreSQL) 접속정보
Globals.postgres.DriverClassName = org.postgresql.Driver
Globals.postgres.Url = jdbc:postgresql://localhost:5432/postgres
Globals.postgres.UserName = postgres
Globals.postgres.Password =

# Supabase 무료 플랜은 동시 접속 수가 적어서 커넥션 풀을 작게 유지
Globals.postgres.MaxPoolSize = 5

# 프론트를 백엔드와 다른 도메인에 배포할 때 허용할 프론트 주소 (콤마로 여러 개)
Globals.Allow.Origin = http://localhost:5173

# 관리자 API(/api/admin/**) 호출 키. 요청 헤더 X-Admin-Key 로 보낸다.
# 비어 있으면 관리자 API 전체가 막힌다. 실제 값은 globals-local.properties 또는 환경변수(GLOBALS_ADMIN_KEY)에.
Globals.Admin.Key =

# Fragella 향수 API (https://api.fragella.com/docs.html)
# 키는 globals-local.properties 또는 환경변수(GLOBALS_FRAGELLA_APIKEY)에. 비어 있으면 향수 검색이 150 오류를 낸다.
Globals.Fragella.BaseUrl = https://api.fragella.com/api/v1
Globals.Fragella.ApiKey =

# Google Gemini (한글 향수 검색어 → 영문 변환). https://ai.google.dev/api/generate-content
# 키는 globals-local.properties 또는 환경변수(GLOBALS_GEMINI_APIKEY)에. 비어 있으면 한글 검색이 152 오류를 낸다.
Globals.Gemini.BaseUrl = https://generativelanguage.googleapis.com/v1beta
Globals.Gemini.Model = gemini-3.5-flash-lite
Globals.Gemini.ApiKey =
